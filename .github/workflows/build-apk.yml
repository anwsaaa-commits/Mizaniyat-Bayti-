name: Build Mizaniyat Bayti APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.alshaheen.homebudget --project-name mizaniyat_bayti --no-pub

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mizaniyat-bayti-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
