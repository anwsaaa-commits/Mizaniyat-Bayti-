name: Build Tuna Sales Ledger APK
on:
 push:
  branches: [main, fish-sales-ledger-rebuild]
 workflow_dispatch:
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: subosito/flutter-action@v2
     with:
      channel: stable
   - name: Generate Android scaffold
     run: flutter create . --org com.alshaheen --project-name tuna_sales_ledger --platforms android --no-pub
   - run: flutter pub get
   - name: Analyze Dart (allow informational lints)
     run: flutter analyze --no-fatal-infos
   - run: flutter test
   - run: flutter build apk --release
   - uses: actions/upload-artifact@v4
     with:
      name: tuna-sales-ledger-apk
      path: build/app/outputs/flutter-apk/app-release.apk
